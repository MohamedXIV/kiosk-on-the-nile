name: Build Godot
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: godot-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: godot-artifacts-${{ runner.os }}-${{ hashFiles('tools/dependencies.lock.json') }}
      - name: Install pinned tools and import
        run: bash tools/setup.sh
      - name: Build release Web package
        run: bash tools/build.sh --release --out exports/web
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: .cache/build-logs
          if-no-files-found: ignore
