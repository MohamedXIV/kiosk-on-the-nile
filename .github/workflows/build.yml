name: Build Godot
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
concurrency:
  group: godot-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project version
        run: python3 tools/release.py check
      - name: Check formal release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Checkout's shallow tag ref may be peeled to a commit. Refresh only
          # this job's local ref from the authoritative remote annotated tag.
          git fetch --force --no-tags --depth=1 origin "$GITHUB_REF:$GITHUB_REF"
          python3 tools/release.py check-tag --tag "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .cache/downloads
          key: godot-artifacts-${{ runner.os }}-${{ hashFiles('tools/dependencies.lock.json') }}
      - name: Install pinned tools and import
        run: bash tools/setup.sh
      - name: Build release Web package
        run: bash tools/build.sh --release --out exports/web
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release.py package --release --web-root exports/web --out exports/packages
      - name: Package complete development preview
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 tools/release.py package --web-root exports/web --out exports/packages
      - name: Retain complete development preview
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: godot-playtest-package
          path: exports/packages
      - name: Retain Web export
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export
          path: exports/web
      - name: Retain tagged package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: godot-versioned-package
          path: exports/packages
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-build-logs
          path: .cache/build-logs
          if-no-files-found: ignore
